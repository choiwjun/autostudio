# .github/workflows/shorts-collect.yml — 쇼츠 S-1 유튜브 수집 배치
# 매일 1회 (AC-S1-1): 인기 동영상(KR) 50개 수집 → youtube_raw 멱등 저장
name: shorts-collect

on:
  schedule:
    - cron: '45 22 * * *'   # 매일 07:45 KST (전날 22:45 UTC) — daily-collect(07:17) 이후
  workflow_dispatch:

concurrency:
  group: shorts-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth
      - name: Decode service account key
        run: |
          mkdir -p data
          echo "${{ secrets.YOUTUBE_SERVICE_ACCOUNT_KEY_B64 }}" | base64 -d > data/gen-lang-client-0043584530-d27491f12e6b.json
      - name: Run shorts collection
        run: python shorts_research.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_SERVICE_ACCOUNT_KEY: data/gen-lang-client-0043584530-d27491f12e6b.json
      # v31 (S-4): 수집 후 스크립트 생성 — ready 없는 상위 후보 3개 (스펙 §5
      # 'GH Actions 또는 사용자 트리거'. LLM 키 없으면 조용히 건너뛰지 않고
      # 오류 로그로 기록 — 원인이 배치에서 보이게)
      - name: Generate shorts scripts (top 3)
        run: python shorts_script.py --batch 3 || echo "script generation failed (non-fatal)"
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BAILIAN_TOKEN_PLAN_API_KEY: ${{ secrets.BAILIAN_TOKEN_PLAN_API_KEY }}
          OPENCODE_GO_API_KEY: ${{ secrets.OPENCODE_GO_API_KEY }}
      - name: Keep-alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          fi
