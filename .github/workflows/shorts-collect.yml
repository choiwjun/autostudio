# .github/workflows/shorts-collect.yml — 쇼츠 S-1 유튜브 수집 배치
# 매일 1회 (AC-S1-1): 인기 동영상(KR) 50개 수집 → youtube_raw 멱등 저장
name: shorts-collect

on:
  schedule:
    - cron: '45 22 * * *'   # 매일 07:45 KST (전날 22:45 UTC) — daily-collect(07:17) 이후
  workflow_dispatch:

concurrency:
  group: shorts-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install google-api-python-client google-auth
      - name: Decode service account key
        run: |
          mkdir -p data
          echo "${{ secrets.YOUTUBE_SERVICE_ACCOUNT_KEY_B64 }}" | base64 -d > data/gen-lang-client-0043584530-d27491f12e6b.json
      - name: Run shorts collection
        run: python shorts_research.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          YOUTUBE_SERVICE_ACCOUNT_KEY: data/gen-lang-client-0043584530-d27491f12e6b.json
      - name: Keep-alive
        if: github.event_name == 'schedule'
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $(( (now - last) / 86400 )) -ge 50 ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep scheduled workflow alive"
            git push
          fi
