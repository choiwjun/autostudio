<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>키워드 대시보드</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
  /* v8: 다크 네오-글래스 — 딥 네이비 그라데이션 + 글래스모피즘 + 오로라 글로우 */
  :root {
    --primary: #6366f1; --primary-dark: #4f46e5;
    --accent-blue: #38bdf8; --accent-mint: #34d399; --accent-amber: #fbbf24; --accent-pink: #f472b6;
    --success: #34d399; --warning: #fbbf24; --danger: #f87171;
    --bg0: #0b1120; --bg1: #111a30; --bg2: #1e1b4b;
    --card: rgba(255, 255, 255, .055); --card-solid: #151f36;
    --border: rgba(255, 255, 255, .09); --border-strong: rgba(255, 255, 255, .16);
    --text: #e2e8f0; --muted: #94a3b8; --dim: #64748b;
  }
  * { box-sizing: border-box; }
  body { margin: 0; color: var(--text); font-size: 14px; min-height: 100vh;
    background: radial-gradient(1100px 700px at 12% -8%, rgba(99,102,241,.30), transparent 60%),
                radial-gradient(900px 650px at 88% 0%, rgba(56,189,248,.16), transparent 55%),
                radial-gradient(1000px 800px at 50% 115%, rgba(244,114,182,.10), transparent 60%),
                linear-gradient(165deg, var(--bg0) 0%, var(--bg1) 45%, var(--bg2) 100%);
    background-attachment: fixed;
    font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont,
                 system-ui, Roboto, 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif; }
  /* 오로라 글로우 오브 */
  .aurora { position: fixed; border-radius: 50%; filter: blur(90px); opacity: .5; pointer-events: none; z-index: 0; }
  .aurora.a1 { width: 420px; height: 420px; top: -120px; left: -80px; background: #6366f1; animation: drift1 22s ease-in-out infinite alternate; }
  .aurora.a2 { width: 360px; height: 360px; top: 30%; right: -120px; background: #38bdf8; animation: drift2 26s ease-in-out infinite alternate; }
  .aurora.a3 { width: 300px; height: 300px; bottom: -100px; left: 35%; background: #f472b6; opacity: .28; animation: drift1 30s ease-in-out infinite alternate-reverse; }
  @keyframes drift1 { from { transform: translate(0,0) scale(1); } to { transform: translate(60px,40px) scale(1.15); } }
  @keyframes drift2 { from { transform: translate(0,0) scale(1); } to { transform: translate(-50px,30px) scale(1.1); } }

  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; position: relative; z-index: 1; }

  /* 상단 바 */
  .topbar { padding: 20px 0; position: relative; z-index: 1;
    background: linear-gradient(180deg, rgba(11,17,32,.55), transparent); }
  .topbar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 21px; margin: 0; font-weight: 800; letter-spacing: -0.02em;
    background: linear-gradient(90deg, #e0e7ff, #7dd3fc, #f0abfc);
    -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .sub { margin: 5px 0 0; font-size: 12px; color: var(--muted); }
  main.wrap { padding: 20px; }

  /* KPI 카드 */
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi { position: relative; overflow: hidden; padding: 18px 16px; border-radius: 16px;
    background: var(--card); border: 1px solid var(--border);
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
    transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease; }
  .kpi::before { content: ''; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--accent-blue), var(--accent-mint)); opacity: .85; }
  .kpi:nth-child(1)::before { background: linear-gradient(90deg, var(--accent-blue), #818cf8); }
  .kpi:nth-child(2)::before { background: linear-gradient(90deg, var(--accent-mint), #2dd4bf); }
  .kpi:nth-child(3)::before { background: linear-gradient(90deg, var(--accent-amber), #fb923c); }
  .kpi:nth-child(4)::before { background: linear-gradient(90deg, var(--accent-pink), #a78bfa); }
  .kpi:hover { transform: translateY(-3px); border-color: var(--border-strong);
    box-shadow: 0 12px 34px rgba(0,0,0,.35); }
  .kpi-label { font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .02em; text-transform: uppercase; }
  .kpi-value { font-size: 26px; font-weight: 800; margin-top: 7px; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; animation: fadeUp .5s ease both; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .kpi-value.warn { color: var(--warning); }
  .kpi-sub { font-size: 12px; color: var(--muted); margin-top: 4px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }

  /* 상태 라인 */
  #status { display: block; font-size: 12px; color: var(--muted); margin-bottom: 14px; min-height: 16px; }
  #status.warn { color: var(--danger); font-weight: 600; }

  /* 필터 바 */
  .filters { padding: 14px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filters select, .filters input { height: 34px; padding: 0 10px; border: 1px solid var(--border);
    border-radius: 10px; background: rgba(15, 23, 42, .6); font-size: 13px; color: var(--text);
    font-family: inherit; transition: border-color .15s ease, box-shadow .15s ease; }
  .filters select:focus, .filters input:focus { outline: none; border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(99, 102, 241, .25); }
  #q { min-width: 160px; }
  .chk { font-size: 12px; color: var(--muted); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .token-box { margin-left: auto; display: inline-flex; gap: 6px; }
  .token-box input { width: 110px; }

  /* 버튼 */
  .btn { height: 34px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--border);
    background: rgba(15, 23, 42, .6); font-size: 13px; font-weight: 600; cursor: pointer; color: var(--text);
    font-family: inherit; transition: background .15s ease, border-color .15s ease, transform .1s ease; }
  .btn:hover { background: rgba(51, 65, 85, .6); border-color: var(--border-strong); }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .5; cursor: default; }
  .btn-primary { background: linear-gradient(135deg, #6366f1, #8b5cf6); border: 0; color: #fff; }
  .btn-primary:hover { background: linear-gradient(135deg, #818cf8, #a78bfa); box-shadow: 0 6px 20px rgba(99,102,241,.4); }
  .btn-sm { height: 26px; padding: 0 10px; font-size: 12px; border-radius: 8px; }

  /* 프리셋 세그먼트 */
  .seg { display: inline-flex; border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .seg button { height: 32px; padding: 0 12px; border: 0; border-right: 1px solid var(--border);
    background: rgba(15, 23, 42, .5); font-size: 12px; font-weight: 600; color: var(--muted);
    cursor: pointer; font-family: inherit; transition: background .15s ease, color .15s ease; }
  .seg button:last-child { border-right: 0; }
  .seg button:hover { background: rgba(51, 65, 85, .5); }
  .seg button.on { background: linear-gradient(135deg, rgba(99,102,241,.35), rgba(139,92,246,.35));
    color: #c7d2fe; border-color: rgba(129,140,248,.4); }

  /* 테이블 */
  .table-wrap { overflow-x: auto; scrollbar-width: thin; scrollbar-color: #334155 transparent; }
  .table-wrap::-webkit-scrollbar { height: 8px; }
  .table-wrap::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; min-width: 1000px; }
  th, td { padding: 11px 12px; font-size: 13px; text-align: left;
    border-bottom: 1px solid var(--border); white-space: nowrap; }
  thead th { position: sticky; top: 0; background: rgba(17, 26, 48, .92); z-index: 2;
    font-size: 11px; color: var(--muted); font-weight: 700; letter-spacing: .03em; text-transform: uppercase; }
  th.sortable { cursor: pointer; user-select: none; color: var(--text); }
  th.sortable:hover { color: var(--accent-blue); }
  .arr { font-size: 10px; color: var(--accent-blue); font-weight: 700; }
  tbody tr { cursor: pointer; position: relative; transition: background .15s ease; }
  tbody tr:hover { background: rgba(99, 102, 241, .10); }
  tbody tr:hover td:first-child { box-shadow: inset 2px 0 0 #818cf8; }
  tbody tr:nth-child(even) { background: rgba(255, 255, 255, .018); }
  .td-kw { max-width: 260px; white-space: normal; word-break: break-all; font-weight: 600; }
  .num { font-variant-numeric: tabular-nums; font-weight: 600; }
  .gauge { display: inline-block; width: 56px; height: 6px; background: rgba(148,163,184,.25);
    border-radius: 3px; vertical-align: middle; margin-right: 6px; overflow: hidden; }
  .gauge i { display: block; height: 100%; border-radius: 3px; }
  .g-blue i { background: linear-gradient(90deg, #38bdf8, #6366f1); }
  .g-green i { background: linear-gradient(90deg, #34d399, #2dd4bf); }
  .dim { color: var(--dim); }
  .rise { color: var(--success); font-weight: 600; }
  .fall { color: var(--danger); font-weight: 600; }
  .excluded { opacity: .45; }

  /* 배지 — 네온 글로우 */
  .badge { display: inline-block; padding: 3px 10px; border-radius: 999px; font-size: 11px;
    font-weight: 700; border: 1px solid transparent; }
  .b-gold { background: rgba(251,191,36,.12); color: #fcd34d; border-color: rgba(251,191,36,.35);
    box-shadow: 0 0 12px rgba(251,191,36,.12); }   /* AI유망 */
  .b-green { background: rgba(52,211,153,.12); color: #6ee7b7; border-color: rgba(52,211,153,.35);
    box-shadow: 0 0 12px rgba(52,211,153,.12); }   /* 애포 */
  .b-warn { background: rgba(251,146,60,.12); color: #fdba74; border-color: rgba(251,146,60,.35);
    box-shadow: 0 0 12px rgba(251,146,60,.12); }   /* 수요낮음 */
  .b-gray { background: rgba(148,163,184,.12); color: #cbd5e1; border-color: rgba(148,163,184,.25); }

  /* 스켈레톤 */
  .skel td { height: 40px; background: linear-gradient(90deg, rgba(148,163,184,.08) 25%, rgba(148,163,184,.16) 37%, rgba(148,163,184,.08) 63%);
    background-size: 400% 100%; animation: pulse 1.2s infinite; border-bottom: 1px solid var(--border); }
  @keyframes pulse { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }
  .empty { color: var(--muted); padding: 48px 16px; text-align: center; line-height: 1.9; white-space: normal; }

  /* 페이저 */
  .pager { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-top: 1px solid var(--border); }
  #pageInfo { font-size: 12px; color: var(--muted); }

  /* 시드 패널 */
  #seedsPanel { margin-top: 12px; padding: 16px; }
  #seedsPanel .seed-form { display: flex; gap: 8px; flex-wrap: wrap; }
  #seedList { list-style: none; margin: 12px 0 0; padding: 0; }
  #seedList li { display: flex; justify-content: space-between; align-items: center; gap: 8px;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
  #seedList li:last-child { border-bottom: 0; }

  /* 상세 모달 */
  #detail { position: fixed; inset: 0; background: rgba(2, 6, 23, .6); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 50;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #detail .panel { background: var(--card-solid); border: 1px solid var(--border); border-radius: 18px; width: 760px;
    max-width: 94vw; max-height: 90vh; overflow: auto; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); }
  .panel-head { display: flex; justify-content: space-between; align-items: center;
    padding: 16px 20px; border-bottom: 1px solid var(--border); }
  .panel-head h3 { margin: 0; font-size: 16px; letter-spacing: -0.01em; }
  .x { border: 0; background: transparent; font-size: 16px; cursor: pointer; color: var(--muted); padding: 4px; }
  .x:hover { color: var(--text); }
  .panel-body { padding: 20px; }
  #detailError { display: none; margin-bottom: 12px; padding: 12px; background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.3); border-radius: 10px; font-size: 13px; color: #fca5a5; }

  /* v7: 글 생성 모달 */
  #draftModal { position: fixed; inset: 0; background: rgba(2, 6, 23, .6); display: none;
    align-items: center; justify-content: center; padding: 20px; z-index: 60;
    backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
  #draftModal .panel { background: var(--card-solid); border: 1px solid var(--border); border-radius: 18px; width: 720px;
    max-width: 94vw; max-height: 90vh; overflow: auto; box-shadow: 0 24px 70px rgba(0, 0, 0, .5); }
  #draftError { display: none; margin-bottom: 12px; padding: 12px; background: rgba(248,113,113,.1);
    border: 1px solid rgba(248,113,113,.3); border-radius: 10px; font-size: 13px; color: #fca5a5; }
  #draftStep { font-size: 14px; line-height: 1.6; }
  .draft-block { margin-bottom: 16px; padding: 14px; background: rgba(15, 23, 42, .5);
    border: 1px solid var(--border); border-radius: 12px; }
  .draft-block h4 { margin: 0 0 8px; font-size: 13px; color: #34d399; letter-spacing: -0.01em; }
  .draft-title { font-size: 17px; font-weight: 700; margin: 0; }
  .draft-body { font-size: 14px; color: #cbd5e1; }
  .tags { margin: 0; padding: 0; list-style: none; display: flex; flex-wrap: wrap; gap: 6px; }
  .tags li { background: rgba(52,211,153,.12); color: #6ee7b7; font-size: 12px; padding: 3px 10px;
    border-radius: 999px; border: 1px solid rgba(52,211,153,.2); }
  .draft-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .draft-img { max-width: 100%; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 6px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid rgba(148,163,184,.3);
    border-top-color: #34d399; border-radius: 50%; animation: spin .8s linear infinite;
    vertical-align: -2px; margin-right: 6px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
  .btn-gen { color: #6ee7b7; background: rgba(52,211,153,.12); border: 1px solid rgba(52,211,153,.35); }
  .btn-gen:hover { background: rgba(52,211,153,.22); }

  /* 접근성: 모션 감소 */
  @media (prefers-reduced-motion: reduce) {
    .aurora, .kpi-value, .skel td { animation: none !important; }
    * { transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
  <div class="aurora a1" aria-hidden="true"></div>
  <div class="aurora a2" aria-hidden="true"></div>
  <div class="aurora a3" aria-hidden="true"></div>
  <header class="topbar">
    <div class="wrap">
      <div>
        <h1>키워드 대시보드</h1>
        <p class="sub">AI 인용 · 수요 · CPC 기반 상용화 키워드 우선순위</p>
      </div>
      <button class="btn btn-primary" id="collectBtn" onclick="collect()">지금 수집 실행</button>
    </div>
  </header>

  <main class="wrap">
    <!-- v6: KPI 카드 — /status + 상위 priority -->
    <section class="kpis" aria-label="핵심 지표">
      <div class="kpi">
        <div class="kpi-label">키워드</div>
        <div class="kpi-value" id="kpiKeywords">-</div>
        <div class="kpi-sub">활성 기준</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">시드 키워드</div>
        <div class="kpi-value" id="kpiSeeds">-</div>
        <div class="kpi-sub">발굴 기준점</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">마지막 수집</div>
        <div class="kpi-value" id="kpiLast">-</div>
        <div class="kpi-sub" id="kpiLastSub">확인 중</div>
      </div>
      <div class="kpi">
        <div class="kpi-label">상위 Priority</div>
        <div class="kpi-value" id="kpiTop">-</div>
        <div class="kpi-sub" id="kpiTopSub">&nbsp;</div>
      </div>
    </section>

    <span id="status"></span>

    <section class="card filters" aria-label="필터">
      <select id="category" onchange="resetAndLoad()" aria-label="분야 필터">
        <option value="">전체 분야</option>
      </select>
      <select id="click" onchange="resetAndLoad()" aria-label="쇼핑클릭 필터">
        <option value="">쇼핑클릭 전체</option>
        <option value="0.5">클릭 0.5+ (앵커 대비)</option>
        <option value="0.2">클릭 0.2+</option>
      </select>
      <select id="discovered" onchange="resetAndLoad()" aria-label="발견기간 필터">
        <option value="">발견기간 전체</option>
        <option value="7">최근 7일</option>
        <option value="30">최근 30일</option>
      </select>
      <input id="q" placeholder="키워드 검색" oninput="onSearchInput()" aria-label="키워드 검색">
      <label class="chk"><input type="checkbox" id="showInactive" onchange="resetAndLoad()"> 제외 목록 포함</label>
      <div class="seg" role="group" aria-label="프리셋">
        <button type="button" id="presetAi" onclick="togglePreset('ai_pick')">AI픽</button>
        <button type="button" id="presetProm" onclick="togglePreset('promising')">유망</button>
        <button type="button" id="presetAll" onclick="togglePreset('')">전체</button>
      </div>
      <button class="btn" onclick="toggleSeeds()">시드키워드 관리</button>
      <div class="token-box">
        <input id="token" type="password" placeholder="토큰" aria-label="대시보드 토큰">
        <button class="btn" onclick="saveToken()">토큰 저장</button>
      </div>
    </section>

    <section class="card" aria-label="키워드 목록">
      <div class="table-wrap">
        <table>
          <thead><tr>
            <th class="sortable" data-sort="priority" onclick="setSort('priority')">Priority</th>
            <th>키워드</th>
            <th>분야</th>
            <th class="sortable" data-sort="ai_cite" onclick="setSort('ai_cite')">AI인용</th>
            <th class="sortable" data-sort="opportunity" onclick="setSort('opportunity')">기회점수</th>
            <th class="sortable" data-sort="click" onclick="setSort('click')">쇼핑클릭</th>
            <th class="sortable" data-sort="demand" onclick="setSort('demand')">수요지수</th>
            <th>총 글 수</th>
            <th class="sortable" data-sort="growth" onclick="setSort('growth')">증감률</th>
            <th>일수</th>
            <th>권장</th>
            <th>글</th>
            <th></th>
          </tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="pager">
        <button class="btn btn-sm" onclick="prevPage()">이전</button>
        <span id="pageInfo"></span>
        <button class="btn btn-sm" onclick="nextPage()">다음</button>
      </div>
    </section>

    <section id="seedsPanel" class="card" style="display:none">
      <div class="seed-form">
        <input id="seedInput" placeholder="시드키워드" aria-label="시드키워드 입력">
        <input id="seedCat" placeholder="분야" aria-label="분야 입력">
        <button class="btn" onclick="addSeed()">추가</button>
      </div>
      <ul id="seedList"></ul>
    </section>
  </main>

  <div id="detail" role="dialog" aria-modal="true">
    <div class="panel">
      <div class="panel-head">
        <h3 id="detailTitle"></h3>
        <button class="x" onclick="closeDetail()" aria-label="닫기">✕</button>
      </div>
      <div class="panel-body">
        <div id="detailError"></div>
        <canvas id="chart" height="240"></canvas>
      </div>
    </div>
  </div>

  <div id="draftModal" role="dialog" aria-modal="true">
    <div class="panel panel-wide">
      <div class="panel-head">
        <h3 id="draftTitle">글 생성</h3>
        <button class="x" onclick="closeDraftModal()" aria-label="닫기">✕</button>
      </div>
      <div class="panel-body">
        <div id="draftError" class="hidden"></div>
        <div id="draftStep"></div>
      </div>
    </div>
  </div>

<script>
// v6: 기본 정렬 priority, 기본 프리셋 ai_pick (server 기본값과 일치)
let sortBy = 'priority';
let sortDir = 'desc';
let page = 1;
let preset = 'ai_pick';
let loading = true;
let loadError = false;
let collectBusy = false;
let detailError = null;
const PAGE_SIZE = 50;
let totalCount = 0;
let chart = null;
let qTimer = null;

// 외부 유래 문자열(키워드·분야 등)은 반드시 이스케이프 (XSS 방지)
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));
}

function authHeaders(extra) {
  const t = localStorage.getItem('dashboard_token') || '';
  return Object.assign(t ? { 'Authorization': 'Bearer ' + t } : {}, extra || {});
}

function saveToken() {
  localStorage.setItem('dashboard_token', document.getElementById('token').value.trim());
  setStatus('토큰 저장됨');
}

function setStatus(msg, warn) {
  const el = document.getElementById('status');
  el.textContent = msg;
  el.className = warn ? 'warn' : '';
}

async function api(path, opts) {
  const full = path.startsWith('/api') ? path : '/api' + path;
  const r = await fetch(full, opts);
  if (r.status === 401) { setStatus('토큰이 올바르지 않습니다 — 토큰 입력 후 저장', true); throw new Error('401'); }
  if (!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

// v6 권장 배지: priority>=70 'AI유망' → opportunity>=60 '애포' → demand<0.01 '수요낮음' → '보류'
function recommend(i) {
  if (i.priority !== null && i.priority >= 70) return { label: 'AI유망', cls: 'b-gold' };
  if (i.opportunity !== null && i.opportunity >= 60) return { label: '애포', cls: 'b-green' };
  if (i.demand_idx !== null && i.demand_idx < 0.01) return { label: '수요낮음', cls: 'b-warn' };
  return { label: '보류', cls: 'b-gray' };
}

function priorityCell(p) {
  if (p === null) return '<span class="dim">—</span>';
  const w = Math.max(0, Math.min(100, p));
  return `<span class="gauge g-blue"><i style="width:${w}%"></i></span><span class="num">${p.toFixed(1)}</span>`;
}

function gaugeCell(opp) {
  if (opp === null) return '<span class="dim">쌓는 중</span>';
  const w = Math.max(0, Math.min(100, opp));
  return `<span class="gauge g-green"><i style="width:${w}%"></i></span><span class="num">${opp.toFixed(0)}</span>`;
}

function renderSortArrows() {
  document.querySelectorAll('th.sortable').forEach(th => {
    th.removeAttribute('aria-sort');
    th.querySelectorAll('.arr').forEach(a => a.remove());
    if (th.dataset.sort === sortBy) {
      th.setAttribute('aria-sort', sortDir === 'desc' ? 'descending' : 'ascending');
      const s = document.createElement('span');
      s.className = 'arr';
      s.textContent = sortDir === 'desc' ? ' ▼' : ' ▲';
      th.appendChild(s);
    }
  });
}

function skeletonRows() {
  let html = '';
  for (let i = 0; i < 8; i++) html += '<tr class="skel"><td colspan="13"></td></tr>';
  return html;
}

async function load() {
  if (loading && !loadError) {
    document.getElementById('rows').innerHTML = skeletonRows();
  }
  const params = new URLSearchParams({
    sort: sortBy, sort_dir: sortDir, page: page, page_size: PAGE_SIZE,
    category: document.getElementById('category').value,
    click_min: document.getElementById('click').value || 0,
    discovered_within: document.getElementById('discovered').value || 0,
    q: document.getElementById('q').value.trim(),
    show_inactive: document.getElementById('showInactive').checked ? 1 : 0,
    preset: preset,
  });
  let data;
  try {
    data = await api('/keywords?' + params);
  } catch (e) {
    if (String(e.message) === '401') return;
    loading = false;
    loadError = true;
    document.getElementById('rows').innerHTML =
      '<tr><td colspan="13" class="empty">데이터를 불러오지 못했습니다 ' +
      '<button class="btn btn-sm" onclick="load()">다시 시도</button></td></tr>';
    return;
  }
  loading = false;
  loadError = false;
  totalCount = data.count;
  const rows = document.getElementById('rows');
  rows.innerHTML = '';
  if (!data.items.length) {
    const filtering = preset || params.get('q') || params.get('category')
      || Number(params.get('click_min')) > 0 || Number(params.get('discovered_within')) > 0
      || params.get('show_inactive') == 1 || page > 1;
    rows.innerHTML = filtering
      ? '<tr><td colspan="13" class="empty">검색 결과가 없습니다 — 필터를 조정하거나 <button class="btn btn-sm" onclick="resetFilters()">필터 초기화</button></td></tr>'
      : '<tr><td colspan="13" class="empty">아직 데이터가 없습니다 — 시드 추가 후 "지금 수집 실행" (점수는 2일차부터)<br>'
        + '<button class="btn" onclick="openSeeds()">시드 추가</button> '
        + '<button class="btn btn-primary" onclick="collect()">지금 수집 실행</button></td></tr>';
  }
  data.items.forEach(i => {
    const clickVal = i.shop_click_idx === null ? '-' : i.shop_click_idx.toFixed(2);
    const clickTip = '쇼핑인사이트 클릭 추이 (앵커 대비)';
    const demand = i.demand_idx === null ? '-' : i.demand_idx.toFixed(2);
    const aiCite = i.ai_cite_idx === null ? '-' : i.ai_cite_idx.toFixed(2);
    const growth = i.growth === null ? '-'
      : `<span class="${i.growth > 0 ? 'rise' : i.growth < 0 ? 'fall' : ''}">${i.growth > 0 ? '▲ ' : i.growth < 0 ? '▼ ' : ''}${(i.growth * 100).toFixed(1)}%</span>`;
    const rec = recommend(i);
    const tr = document.createElement('tr');
    if (!i.active) tr.classList.add('excluded');
    tr.innerHTML = `
      <td>${priorityCell(i.priority)}</td>
      <td class="td-kw">${esc(i.keyword)}${i.active ? '' : ' <span class="badge b-gray">제외됨</span>'}</td>
      <td>${esc(i.category)}</td>
      <td class="num">${esc(aiCite)}</td>
      <td>${gaugeCell(i.opportunity)}</td>
      <td class="num" title="${esc(clickTip)}">${esc(clickVal)}</td>
      <td class="num">${esc(demand)}</td>
      <td class="num">${Number(i.total_sim).toLocaleString()}</td>
      <td title="최신순 글 수(total_date) 전일 대비 — 총 글 수는 정확도순(total_sim)">${growth}</td>
      <td class="num">${esc(i.days)}일</td>
      <td><span class="badge ${rec.cls}">${esc(rec.label)}</span></td>
      <td><button class="btn btn-sm btn-gen" data-kid="${i.id}" data-kw="${esc(i.keyword)}" onclick="event.stopPropagation(); openDraftModal(this)">글 생성</button></td>
      <td><button class="btn btn-sm" onclick="toggleActive(${i.id}, ${i.active ? 'false' : 'true'}, event)">${i.active ? '제외' : '복원'}</button></td>`;
    tr.onclick = () => detail(i.id);
    rows.appendChild(tr);
  });
  renderSortArrows();
  const maxPage = Math.max(1, Math.ceil(totalCount / PAGE_SIZE));
  document.getElementById('pageInfo').textContent = `${totalCount}건 · ${page}/${maxPage}페이지`;
}

function resetAndLoad() { page = 1; load(); loadTopKpi(); }
function resetFilters() {
  document.getElementById('category').value = '';
  document.getElementById('click').value = '';
  document.getElementById('discovered').value = '';
  document.getElementById('q').value = '';
  document.getElementById('showInactive').checked = false;
  preset = 'ai_pick';
  updatePresetBtn();
  resetAndLoad();
}
function setSort(col) {
  if (col === sortBy) sortDir = sortDir === 'desc' ? 'asc' : 'desc';
  else { sortBy = col; sortDir = 'desc'; }
  resetAndLoad();
}
// v6: 프리셋 세그먼트 — 활성 프리셋 재클릭 시 해제(''), '전체'는 필터 없음
function togglePreset(p) {
  if (!p) preset = '';
  else preset = preset === p ? '' : p;
  updatePresetBtn();
  resetAndLoad();
}
function updatePresetBtn() {
  document.getElementById('presetAi').classList.toggle('on', preset === 'ai_pick');
  document.getElementById('presetProm').classList.toggle('on', preset === 'promising');
  document.getElementById('presetAll').classList.toggle('on', preset === '');
}
function onSearchInput() { clearTimeout(qTimer); qTimer = setTimeout(resetAndLoad, 300); }
function prevPage() { if (page > 1) { page--; load(); } }
function nextPage() { if (page * PAGE_SIZE < totalCount) { page++; load(); } }

async function toggleActive(id, active, ev) {
  ev.stopPropagation();
  await api(`/keywords/${id}`, {
    method: 'PATCH',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ active: active }),
  });
  load();
}

async function loadCategories() {
  try {
    const cats = await api('/categories');
    const sel = document.getElementById('category');
    const cur = sel.value;
    sel.innerHTML = '<option value="">전체 분야</option>'
      + cats.map(c => `<option value="${esc(c)}">${esc(c)}</option>`).join('');
    sel.value = cur;
  } catch (e) { /* 카테고리 로드 실패해도 목록은 표시 */ }
}

async function collect() {
  if (collectBusy) return;
  collectBusy = true;
  const btn = document.getElementById('collectBtn');
  btn.disabled = true;
  btn.textContent = '수집 중...';
  setStatus('수집 실행 중... (최대 45초)');
  try {
    const res = await api('/collect', { method: 'POST', headers: authHeaders() });
    if (res.locked) setStatus('이미 수집이 실행 중입니다 — 잠시 후 새로고침');
    else if (res.partial) setStatus(`시간 예산 내 일부만 갱신 (스냅샷 ${res.snapshotted}개) — 나머지는 매일 자동 수집이 처리`);
    else setStatus(`완료: 신규 ${res.new_keywords}개 / 스냅샷 ${res.snapshotted}개 / 오류 ${res.errors.length}개`);
  } catch (e) {
    if (String(e.message) !== '401') setStatus('요청이 시간 초과됐을 수 있습니다 — 전체 수집은 매일 아침 자동 실행됩니다', true);
  } finally {
    collectBusy = false;
    btn.disabled = false;
    btn.textContent = '지금 수집 실행';
  }
  await refreshStatus();
  loadTopKpi();
  load();
}

async function refreshStatus() {
  let s;
  try {
    s = await api('/status');
  } catch (e) {
    if (String(e.message) !== '401') setStatus('상태를 불러오지 못했습니다', true);
    return;
  }
  document.getElementById('kpiKeywords').textContent = Number(s.keyword_count).toLocaleString();
  document.getElementById('kpiSeeds').textContent = Number(s.seed_count).toLocaleString();
  const lastEl = document.getElementById('kpiLast');
  const lastSub = document.getElementById('kpiLastSub');
  let msg = `키워드 ${s.keyword_count}개 · 시드 ${s.seed_count}개`;
  let warn = false;
  if (s.last_success) {
    const day = (s.last_success.finished_at || '').slice(0, 10);
    const ageDays = Math.floor((new Date(s.today) - new Date(day)) / 86400000);
    lastEl.textContent = day;
    lastEl.classList.toggle('warn', ageDays > 2);
    lastSub.textContent = ageDays > 2 ? `${ageDays}일 전 — 수집 지연 ⚠` : `${ageDays}일 전`;
    msg += ` · 마지막 성공 수집 ${day}`;
    if (ageDays > 2) { msg += ' ⚠ 수집이 밀려 있습니다 (Actions/Supabase 상태 확인)'; warn = true; }
  } else {
    lastEl.textContent = '-';
    lastSub.textContent = '수집 이력 없음';
    msg += ' · 수집 이력 없음';
  }
  setStatus(msg, warn);
}

// v8: KPI '상위 Priority' — 현재 프리셋 기준 1위 (테이블과 동일 기준)
async function loadTopKpi() {
  const el = document.getElementById('kpiTop');
  const sub = document.getElementById('kpiTopSub');
  try {
    const d = await api('/keywords?' + new URLSearchParams({
      sort: 'priority', sort_dir: 'desc', page: 1, page_size: 1, preset: preset,
    }));
    const top = d.items[0];
    if (top && top.priority !== null) {
      el.textContent = top.priority.toFixed(1);
      sub.textContent = top.keyword;
    } else {
      el.textContent = '-';
      sub.textContent = '데이터 없음';
    }
  } catch (e) { /* KPI 전용 — 실패해도 목록과 무관 */ }
}

async function detail(id) {
  detailError = null;
  document.getElementById('detailError').style.display = 'none';
  let d;
  try {
    d = await api(`/keywords/${id}`);
  } catch (e) {
    if (String(e.message) === '401') return;
    detailError = e;
  }
  if (detailError) {
    const panel = document.getElementById('detailError');
    panel.style.display = 'block';
    panel.innerHTML = String(detailError.message).startsWith('HTTP 404')
      ? '<strong>키워드를 찾을 수 없습니다</strong> (삭제되었거나 더 이상 존재하지 않음)<br><br>'
        + '<button class="btn btn-sm" onclick="closeDetail()">목록으로 돌아가기</button>'
      : '<strong>상세 정보를 불러오지 못했습니다</strong><br><br>'
        + `<button class="btn btn-sm" onclick="detail(${id})">다시 시도</button>`;
    showDetailPanel(true);
    return;
  }
  document.getElementById('detailTitle').textContent = d.keyword;
  showDetailPanel(true);
  const ctx = document.getElementById('chart');
  if (chart) chart.destroy();
  const chartUnit = { '기회점수': '점수', '수요지수×100': '지수', '쇼핑클릭×100': '지수', '총 글 수': '글' };
  chart = new Chart(ctx, {
    type: 'line',
    data: {
      labels: d.history.map(h => /^\d{8}$/.test(h.day)
        ? `${Number(h.day.slice(4, 6))}/${Number(h.day.slice(6, 8))}`
        : h.day),
      datasets: [
        { label: '기회점수', data: d.history.map(h => h.opportunity), borderColor: '#34d399', backgroundColor: '#34d399', yAxisID: 'y', borderWidth: 2.5, pointRadius: 3, tension: 0.3, spanGaps: true },
        { label: '수요지수×100', data: d.history.map(h => h.demand_idx === null ? null : h.demand_idx * 100), borderColor: '#818cf8', backgroundColor: '#818cf8', yAxisID: 'y', borderWidth: 2.5, pointRadius: 3, tension: 0.3, spanGaps: true },
        { label: '총 글 수', data: d.history.map(h => h.total_sim), borderColor: '#64748b', backgroundColor: '#64748b', yAxisID: 'y2', borderWidth: 1.5, borderDash: [5, 5], pointRadius: 3, tension: 0.3, spanGaps: true },
        { label: '쇼핑클릭×100', data: d.history.map(h => h.shop_click_idx === null ? null : h.shop_click_idx * 100), borderColor: '#fbbf24', backgroundColor: '#fbbf24', yAxisID: 'y', borderWidth: 2.5, pointRadius: 3, tension: 0.3, spanGaps: true },
      ],
    },
    options: {
      responsive: true,
      maintainAspectRatio: true,
      interaction: { mode: 'index', intersect: false },
      plugins: {
        legend: { position: 'top', labels: { boxWidth: 12, color: '#cbd5e1' } },
        tooltip: {
          callbacks: {
            label: (item) => {
              const v = item.parsed.y;
              if (v === null || v === undefined) return `${item.dataset.label}: -`;
              const num = Number(v).toLocaleString('ko-KR', { maximumFractionDigits: 1 });
              return `${item.dataset.label}: ${num} ${chartUnit[item.dataset.label] || ''}`;
            },
          },
        },
      },
      scales: {
        x: { grid: { display: false }, ticks: { color: '#94a3b8' } },
        y: { position: 'left', min: 0, max: 100, grid: { color: 'rgba(148,163,184,.14)' }, ticks: { color: '#94a3b8' } },
        y2: {
          position: 'right',
          grid: { drawOnChartArea: false },
          ticks: { color: '#94a3b8', callback: v => Number(v).toLocaleString('ko-KR') },
        },
      },
    },
  });
}

function showDetailPanel(open) { document.getElementById('detail').style.display = open ? 'flex' : 'none'; }
function closeDetail() { showDetailPanel(false); }
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });
document.getElementById('detail').addEventListener('click',
  e => { if (e.target.id === 'detail') closeDetail(); });

// v7: 콘텐츠 자동화 — 글 생성 플로우 (골격 분석 → 초안 생성 → 이미지 → 복사)
let draftStepEl = null;
let draftCurrent = null;  // 현재 초안 {id, keyword, title, first_paragraph, body, image_url}

function showDraftPanel(open) {
  document.getElementById('draftModal').style.display = open ? 'flex' : 'none';
}
function closeDraftModal() {
  showDraftPanel(false);
  draftCurrent = null;
}
document.getElementById('draftModal').addEventListener('click',
  e => { if (e.target.id === 'draftModal') closeDraftModal(); });

function draftErrorHtml(msg) {
  const el = document.getElementById('draftError');
  el.style.display = 'block';
  el.textContent = msg;
  return '<button class="btn btn-sm" onclick="closeDraftModal()">닫기</button>';
}

async function openDraftModal(btn) {
  const kid = Number(btn.dataset.kid);
  const kw = btn.dataset.kw;
  draftCurrent = null;
  draftStepEl = document.getElementById('draftStep');
  document.getElementById('draftError').style.display = 'none';
  document.getElementById('draftTitle').textContent = `글 생성 — ${kw}`;
  showDraftPanel(true);
  draftStepEl.innerHTML = '<div class="spinner"></div> 상위글 골격을 분석하는 중...';
  try {
    await api(`/outlines/${kid}`, { method: 'POST', headers: authHeaders() });
  } catch (e) {
    if (String(e.message) === '401') return;
    draftStepEl.innerHTML = draftErrorHtml('골격 분석에 실패했습니다 (네이버 API 오류일 수 있음)');
    return;
  }
  await renderOutlineStep(kid, kw);
}

async function renderOutlineStep(kid, kw) {
  draftStepEl.innerHTML = '<div class="spinner"></div> 골격을 불러오는 중...';
  let outline;
  try {
    outline = await api(`/outlines/${kid}`);
  } catch (e) {
    if (String(e.message) === '401') return;
    draftStepEl.innerHTML = draftErrorHtml('골격을 불러오지 못했습니다');
    return;
  }
  let struct;
  try { struct = typeof outline.structure === 'string' ? JSON.parse(outline.structure) : outline.structure; }
  catch (err) { struct = { questions: [], comparisons: [], facts: [] }; }
  const tags = (arr, label) => (arr && arr.length)
    ? `<div class="draft-block"><h4>${label}</h4><ul class="tags">${arr.slice(0, 6).map(t => `<li>${esc(t)}</li>`).join('')}</ul></div>`
    : '';
  draftStepEl.innerHTML = `
    <p class="dim">상위글 골격 (분석일 ${esc(outline.day || '-')}) — 검색에서 인용되는 구조입니다</p>
    ${tags(struct.questions, '질문형 소제목')}
    ${tags(struct.comparisons, '비교/차이')}
    ${tags(struct.facts, '수치·근거')}
    <div class="draft-actions">
      <button class="btn btn-primary" id="createDraftBtn">초안 생성</button>
      <button class="btn" onclick="closeDraftModal()">닫기</button>
    </div>`;
  document.getElementById('createDraftBtn').onclick = () => createDraft(kid);
}

async function createDraft(kid) {
  draftStepEl.innerHTML = '<div class="spinner"></div> 초안을 생성하는 중... (최대 55초)';
  try {
    const d = await api('/drafts', {
      method: 'POST',
      headers: authHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ keyword_id: kid }),
    });
    draftCurrent = d;
    await renderDraftStep(d);
  } catch (e) {
    if (String(e.message) === '401') return;
    draftStepEl.innerHTML = draftErrorHtml('초안 생성에 실패했습니다 (opencode CLI 오류일 수 있음)');
  }
}

async function renderDraftStep(d) {
  draftStepEl.innerHTML = `
    <div class="draft-block">
      <h4>제목</h4><p class="draft-title">${esc(d.title)}</p>
    </div>
    <div class="draft-block">
      <h4>첫문단 (즉답 구조)</h4><p>${esc(d.first_paragraph)}</p>
    </div>
    <div class="draft-block">
      <h4>본문</h4><div class="draft-body">${esc(d.body).replace(/\n/g, '<br>')}</div>
    </div>
    <div class="draft-block" id="imgWrap">
      <h4>블로그 이미지</h4>
      <div id="imgArea"></div>
    </div>
    <div class="draft-actions">
      <button class="btn" id="genImgBtn">이미지 생성</button>
      <button class="btn btn-primary" id="copyBtn">복사</button>
    </div>`;
  document.getElementById('genImgBtn').onclick = () => generateDraftImage(d.id);
  document.getElementById('copyBtn').onclick = () => copyDraft(d);
  if (d.image_url) showDraftImage(d.image_url);
}

function showDraftImage(url) {
  document.getElementById('imgArea').innerHTML =
    `<img src="${esc(url)}" alt="생성 이미지" class="draft-img"><p class="dim">${esc(url)}</p>`;
}

async function generateDraftImage(did) {
  const area = document.getElementById('imgArea');
  area.innerHTML = '<div class="spinner"></div> 이미지 생성 중... (키 필요)';
  try {
    const d = await api(`/drafts/${did}/image`, { method: 'POST', headers: authHeaders() });
    draftCurrent = d;
    showDraftImage(d.image_url);
  } catch (e) {
    if (String(e.message) === '401') return;
    if (String(e.message).startsWith('HTTP 503')) {
      area.innerHTML = '<p class="warn">이미지 키가 필요합니다 — BAILIAN_TOKEN_PLAN_API_KEY 설정 후 다시 시도 (텍스트 초안은 그대로 사용 가능)</p>';
    } else {
      area.innerHTML = '<p class="warn">이미지 생성 실패 — 다시 시도해주세요</p>';
    }
  }
}

async function copyDraft(d) {
  const text = `# ${d.title}\n\n${d.first_paragraph}\n\n${d.body}`;
  try {
    await navigator.clipboard.writeText(text);
    setStatus('초안이 복사되었습니다 — 네이버 블로그에 붙여넣으세요');
  } catch (err) {
    const ta = document.createElement('textarea');
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    ta.remove();
    setStatus('초안이 복사되었습니다');
  }
}

async function toggleSeeds() {
  const panel = document.getElementById('seedsPanel');
  panel.style.display = panel.style.display === 'none' ? 'block' : 'none';
  await renderSeeds();
}

function openSeeds() {
  document.getElementById('seedsPanel').style.display = 'block';
  renderSeeds();
}

async function renderSeeds() {
  let seeds;
  try {
    seeds = await api('/seeds');
  } catch (e) {
    if (String(e.message) !== '401') setStatus('시드 목록을 불러오지 못했습니다', true);
    return;
  }
  const ul = document.getElementById('seedList');
  ul.innerHTML = '';
  seeds.forEach(s => {
    const li = document.createElement('li');
    li.innerHTML = `<span>${esc(s.keyword)} <span class="dim">(${esc(s.category)})</span></span>`
      + `<button class="btn btn-sm" onclick="deleteSeed(${s.id})">삭제</button>`;
    ul.appendChild(li);
  });
}

async function addSeed() {
  const keyword = document.getElementById('seedInput').value.trim();
  const category = document.getElementById('seedCat').value.trim();
  if (!keyword) return;
  await api('/seeds', {
    method: 'POST',
    headers: authHeaders({ 'Content-Type': 'application/json' }),
    body: JSON.stringify({ keyword, category }),
  });
  document.getElementById('seedInput').value = '';
  await renderSeeds();
}

async function deleteSeed(id) {
  await api(`/seeds/${id}`, { method: 'DELETE', headers: authHeaders() });
  await renderSeeds();
}

document.getElementById('token').value = localStorage.getItem('dashboard_token') || '';
updatePresetBtn();
refreshStatus();
loadTopKpi();
loadCategories();
load();
</script>
</body>
</html>
